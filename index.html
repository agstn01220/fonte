<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Fonte">
<title>Fonte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap">
<style>
  :root {
    --bg: #15131f;
    --panel: #1f1c2e;
    --panel-2: #2a2640;
    --line: #37324f;
    --text: #f1eefb;
    --muted: #a39fbd;
    --accent: #b8a4ff;
    --on-accent: #1c1433;
    --peach: #ffc3a8;
    --ok: #9be7c4;
    --half: #ffe29a;
    --near: #a7d3ff;
    --fail: #ffadb0;
    --display: "Unbounded", system-ui, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; position: fixed; inset: 0; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; font-size: 16px; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; width: 100%; outline: none; }
  input:focus { border-color: var(--muted); }
  [hidden] { display: none !important; }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -.2em; }

  header { display: flex; align-items: center; gap: 12px; padding: calc(10px + var(--safe-t)) 16px 10px;
    background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  header h1 { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  #clock { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: 36px; height: 36px;
    display: grid; place-items: center; font-size: 17px; flex: none; }

  main { flex: 1; position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; overflow-y: auto; padding: 14px 16px 32px; display: none; -webkit-overflow-scrolling: touch; }
  .view.active { display: block; }

  nav { display: flex; align-items: center; justify-content: space-around; background: var(--panel);
    border-top: 1px solid var(--line); padding: 6px 8px max(8px, calc(var(--safe-b) - 8px)); z-index: 5; }
  nav .tab { background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 11px; padding: 4px 10px; min-width: 64px; }
  nav .tab .ic { width: 23px; height: 23px; }
  nav .tab.on { color: var(--text); }

  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.ghost { background: none; }
  .btn.danger { color: var(--fail); background: none; }
  .btn.block { width: 100%; }
  .muted { color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 2px 10px; font-weight: 700; }

  /* Accueil : choix de la séance */
  .today { margin: 4px 2px 6px; }
  .today b { display: block; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.25; margin-top: 2px; }
  .types { display: grid; gap: 10px; }
  .type { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; width: 100%; }
  .type.next { border-color: var(--accent); background: #262139; }
  .type .tx { flex: 1; min-width: 0; }
  .type .tx b { display: block; font-size: 17px; }
  .type .tx small { color: var(--muted); font-size: 13px; }
  .type .badge { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .type .ic { color: var(--muted); }
  .type.free { background: none; border-style: dashed; }

  /* Séance */
  .s-head { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .s-type { background: none; border: 0; padding: 0; font-family: var(--display); font-weight: 700; font-size: 21px;
    display: flex; align-items: center; gap: 8px; text-align: left; }
  .s-type .ic { width: 16px; height: 16px; color: var(--muted); }
  .s-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .s-when { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px; }
  .s-live { font-size: 13px; color: var(--ok); display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .s-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .s-sum { font-size: 13px; color: var(--muted); }

  .ex { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .ex-top { display: flex; align-items: center; gap: 10px; }
  .ex-n { width: 26px; height: 26px; border-radius: 8px; background: #332c52; display: grid; place-items: center;
    font-size: 13px; font-weight: 800; color: var(--accent); flex: none; }
  .ex-name { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
  .ex-name b { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-name small { color: var(--muted); font-size: 12.5px; }
  .prev { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; font-size: 12.5px; color: var(--muted); }
  .pchip { display: inline-flex; align-items: center; gap: 4px; background: var(--panel-2); border-radius: 999px; padding: 2px 8px;
    color: var(--text); font-variant-numeric: tabular-nums; }
  .pchip .ic { width: 13px; height: 13px; }
  .hint { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ok); margin-top: 6px; }
  .hint .ic { width: 15px; height: 15px; }
  .ex-note { font-size: 13px; color: var(--half); margin-top: 8px; display: flex; gap: 6px; align-items: center; }

  .rows { display: grid; gap: 6px; margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .w { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 11px; padding: 8px 11px; text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .w b { font-size: 19px; }
  .w .u { color: var(--muted); font-size: 13px; }
  .w .n { font-size: 16px; font-weight: 700; }
  .w small { color: var(--muted); font-size: 12px; }
  .w .tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; align-self: center; }
  .row.pending .w { border-style: dashed; background: transparent; }
  .row.pending .w b, .row.pending .w .n { color: var(--muted); }
  .row.wu .w b { font-size: 16px; }
  .marks { display: flex; gap: 4px; flex: none; }
  .mk { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: none; color: #5f5a7c;
    display: grid; place-items: center; padding: 0; }
  .mk .ic { width: 20px; height: 20px; }
  .mk.on.ok { background: var(--ok); border-color: var(--ok); color: #0f2a1f; }
  .mk.on.half { background: var(--half); border-color: var(--half); color: #2e2408; }
  .mk.on.near { background: var(--near); border-color: var(--near); color: #0c2238; }
  .mk.on.fail { background: var(--fail); border-color: var(--fail); color: #3a1216; }
  .c-ok { color: var(--ok); } .c-half { color: var(--half); } .c-near { color: var(--near); } .c-fail { color: var(--fail); }
  .ex-add { display: flex; gap: 8px; margin-top: 10px; }
  .ex-add button { flex: 1; background: none; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; color: var(--muted);
    font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .add-ex { width: 100%; background: none; border: 1px dashed var(--line); border-radius: 14px; padding: 14px; color: var(--muted);
    font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .s-foot { display: grid; gap: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; font-size: 12px; color: var(--muted); margin: 16px 0 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }

  /* Historique */
  .hist-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .hist-card .d { width: 46px; text-align: center; flex: none; }
  .hist-card .d b { display: block; font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.1; }
  .hist-card .d small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .hist-card .tx { flex: 1; min-width: 0; }
  .hist-card .tx b { display: block; }
  .hist-card .tx small { color: var(--muted); font-size: 13px; }
  .hist-card .res { display: flex; gap: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .hist-card .res span { display: inline-flex; align-items: center; gap: 2px; }
  .hist-card .res .ic { width: 14px; height: 14px; }
  .live-tag { font-size: 11px; font-weight: 800; color: var(--ok); text-transform: uppercase; letter-spacing: .06em; }
  .back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--muted); padding: 2px 0 10px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; }

  /* Séance passée en lecture seule */
  .ro-top { display: flex; align-items: center; justify-content: space-between; }
  .ro-top .back { padding-bottom: 0; }
  .edit-btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; gap: 6px; }
  .ro-top + .s-head { margin-top: 10px; }
  .s-title { font-family: var(--display); font-weight: 700; font-size: 21px; }
  .s-date { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .ro-ex .ex-top { margin-bottom: 4px; }
  .ro { display: flex; align-items: baseline; gap: 6px; padding: 8px 2px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ro:first-of-type { border-top: 0; }
  .ro b { font-size: 17px; }
  .ro .u { color: var(--muted); font-size: 13px; }
  .ro .n { font-weight: 700; }
  .ro small { color: var(--muted); font-size: 12px; }
  .ro .tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; align-self: center; }
  .ro .res { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; align-self: center; }
  .editbar { position: sticky; top: -14px; margin: -14px -16px 12px; padding: 10px 16px; background: var(--accent); color: var(--on-accent);
    display: flex; align-items: center; gap: 8px; z-index: 3; font-weight: 700; font-size: 14px; }
  .editbar span { flex: 1; display: inline-flex; align-items: center; gap: 6px; }
  .editbar button { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 14px; }
  .editbar .cancel { background: rgba(28,20,51,.12); color: var(--on-accent); }
  .editbar .okb { background: var(--on-accent); color: var(--accent); }

  /* Accueil */
  .hero { background: #262139; border: 1px solid var(--accent); border-radius: 16px; padding: 16px; }
  .hero .k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .hero b { display: block; font-family: var(--display); font-weight: 700; font-size: 22px; margin: 4px 0 2px; }
  .hero p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .metric small { display: block; color: var(--muted); font-size: 12px; }
  .metric b { font-family: var(--display); font-weight: 700; font-size: 22px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; }
  .week span { font-size: 11.5px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
  .week i { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; }
  .week i.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .week i.today { border-color: var(--peach); }
  .week i .ic { width: 15px; height: 15px; }
  .week i span { color: inherit; }
  .recs { display: grid; gap: 8px; }
  .rec { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; text-align: left; }
  .rec > .ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .rec .tx { flex: 1; min-width: 0; font-size: 14px; }
  .rec .tx b { display: block; font-size: 14.5px; }
  .rec .tx small { color: var(--muted); font-size: 13px; }
  .ico.up { background: rgba(155,231,196,.14); color: var(--ok); }
  .ico.keep { background: rgba(255,173,176,.14); color: var(--fail); }
  .ico.info { background: rgba(255,226,154,.14); color: var(--half); }
  .ico.save { background: rgba(184,164,255,.16); color: var(--accent); }
  .ico.rest { background: rgba(167,211,255,.14); color: var(--near); }
  .dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--peach); border: 2px solid var(--bg); }
  #settings-btn { position: relative; }

  /* Calendrier */
  .cal-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; }
  .cal-head h2 { flex: 1; text-align: center; margin: 0; font-family: var(--display); font-size: 19px; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--text); }
  .cal-head h2 small { display: block; font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .cal-head .icon-btn { width: 40px; height: 40px; }
  .cal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; touch-action: pan-y; }
  .cal-dow, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
  .cal-dow span { font-size: 11.5px; color: var(--muted); padding-bottom: 8px; }
  .cal-grid { row-gap: 6px; }
  .cd { height: 44px; min-width: 0; display: grid; place-items: center; background: none; border: 0; padding: 0; }
  .cd span { width: 38px; height: 38px; max-width: 100%; border-radius: 50%; display: grid; place-items: center; font-size: 14.5px; font-variant-numeric: tabular-nums; position: relative; }
  .cd.out span { color: #4d4868; }
  .cd.today span { box-shadow: inset 0 0 0 2px var(--peach); }
  .cd.gym span { color: var(--on-accent); font-weight: 800; }
  .cd.gym.today span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--peach); }
  .cd i { position: absolute; bottom: -2px; right: -2px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--text); color: var(--bg);
    font-size: 9.5px; font-weight: 800; font-style: normal; display: grid; place-items: center; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 12px 4px 0; font-size: 12.5px; color: var(--muted); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .today-btn { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); display: block; margin: 0 auto 10px; }

  /* Sauvegardes */
  .bk-state { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
  .bk-list .it { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .bk-list .it div { flex: 1; min-width: 0; }
  .bk-list .it small { display: block; color: var(--muted); font-size: 12.5px; }
  .bk-list .it button { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }

  /* Feuilles du bas */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; opacity: 0; transition: opacity .2s; }
  .backdrop.on { opacity: 1; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0; padding: 8px 16px calc(16px + var(--safe-b)); max-height: 88%; overflow-y: auto;
    transform: translateY(100%); transition: transform .22s ease-out; }
  .backdrop.on .sheet { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 10px; }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; }
  .sheet h3 small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-top: 2px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
  .sheet-actions .btn { flex: 1; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin: 0 2px 5px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; }
  .stepper b { min-width: 44px; text-align: center; font-size: 22px; font-variant-numeric: tabular-nums; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; }
  .switch { width: 50px; height: 30px; border-radius: 999px; background: var(--line); border: 0; position: relative; padding: 0; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch.on { background: var(--ok); }
  .switch.on::after { transform: translateX(20px); }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-btns .btn { flex: 1; padding: 10px; font-size: 14px; }
  .ex-hist { margin-top: 18px; }
  .ex-hist .it { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .ex-hist .it > span:first-child { color: var(--muted); width: 74px; flex: none; }
  .ex-hist .it > span:last-child { display: flex; flex-wrap: wrap; gap: 4px; }

  /* Roulettes */
  .wheels { display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; margin: 4px 0 6px; }
  .wheels::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; margin-top: -22px;
    background: var(--panel-2); border-radius: 12px; pointer-events: none; }
  .wcol { position: relative; display: flex; flex-direction: column; align-items: center; }
  .wcol label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 4px; }
  .wsc { height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; position: relative; z-index: 1;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
  .wsc::-webkit-scrollbar { display: none; }
  .wsp { height: 88px; }
  .wi { height: 44px; display: grid; place-items: center; scroll-snap-align: center; font-size: 22px; color: var(--muted);
    font-variant-numeric: tabular-nums; padding: 0 8px; transition: color .1s; }
  .wi.on { color: var(--text); font-weight: 700; font-size: 26px; }
  .wsep { font-size: 22px; color: var(--muted); z-index: 1; margin-bottom: 22px; }
  .wcol.kg .wsc { width: 84px; } .wcol.dec .wsc { width: 56px; } .wcol.n .wsc { width: 60px; } .wcol.reps .wsc { width: 60px; }
  .quick { display: flex; gap: 6px; justify-content: center; margin: 6px 0 4px; }
  .quick button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-variant-numeric: tabular-nums; }

  #toast { position: fixed; left: 50%; bottom: calc(80px + var(--safe-b)); transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 99; opacity: 0; transition: opacity .2s; pointer-events: none;
    width: max-content; max-width: calc(100% - 32px); text-align: center; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>FONT<span>E</span></h1>
  <span id="clock"></span>
  <button class="icon-btn" id="settings-btn" aria-label="Sauvegardes"><span data-ic="archive"></span></button>
</header>
<main>
  <section class="view active" id="view-home"></section>
  <section class="view" id="view-today"></section>
  <section class="view" id="view-cal"></section>
  <section class="view" id="view-history"></section>
  <section class="view" id="view-detail"></section>
</main>
<nav>
  <button class="tab on" data-view="home"><span data-ic="home"></span>Accueil</button>
  <button class="tab" data-view="today"><span data-ic="dumbbell"></span>Séance</button>
  <button class="tab" data-view="cal"><span data-ic="calendar"></span>Calendrier</button>
  <button class="tab" data-view="history"><span data-ic="list"></span>Historique</button>
</nav>
<div id="toast"></div>

<script>
const ICONS = {
  dumbbell: '<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  sliders: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  ok: '<path d="m5 12.5 4.5 4.5L19 7"/>',
  half: '<path d="M3 12.5c1.5-3 3.5-3 5 0s3.5 3 5 0 3.5-3 5 0 2 2.2 3 1.5"/>',
  near: '<path d="M20 12a8 8 0 1 1-8-8"/><path d="m9 12 2.5 2.5L20 5"/>',
  fail: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  dots: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  chev: '<path d="m9 5 7 7-7 7"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  flame: '<path d="M12 3c.5 3 4.5 5 4.5 10a4.5 4.5 0 0 1-9 0c0-2.5 1.5-3.5 2-5.5 1 .8 1.5 1.8 1.5 3 1-1.5 1.5-4 1-7.5z"/>',
  note: '<path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  upload: '<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
  repeat: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>',
  flag: '<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  archive: '<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  restore: '<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5M4 4v4.5h4.5"/><path d="M12 8v4l2.5 2"/>'
};
const ic = name => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;
document.querySelectorAll("[data-ic]").forEach(el => el.innerHTML = ic(el.dataset.ic));

// Les 4 résultats possibles d'une ligne de séries
const MARKS = {
  ok:   { label: "Réussi" },
  near: { label: "Presque" },
  half: { label: "Moyen" },
  fail: { label: "Raté" }
};
const MARK_ORDER = ["ok", "near", "half", "fail"];

// ---------- Petits utilitaires ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || "").trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pad = n => String(n).padStart(2, "0");
const fmtKg = kg => kg === 0 ? "PDC" : String(kg).replace(".", ",");
const fmtDay = d => cap(d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }));
const fmtShort = d => d.toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" });
const fmtTime = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtDur = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${pad(min % 60)}`;
const dateInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localIso = d => `${dateInput(d)}T${fmtTime(d)}:00`;
const sameDay = (a, b) => dateInput(a) === dateInput(b);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
const icon = name => h("span", { html: ic(name), style: "display:contents" });

let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200);
}

// ---------- Données ----------
// Une séance : { id, type, start, hasTime, end, done, exercises: [{ id, name, reps, set, note, sets: [{ kg, n, reps, mark, wu }] }] }
// Une ligne « 18 kg × 3 » = 3 séries à 18 kg ; reps = null → reps visés de l'exercice.
const KEY = "fonte-data";

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.sessions)) return d;
  } catch {}
  return { app: "fonte", v: 1, sessions: [] };
}
let db = load();
// changedAt / backupAt : pour savoir s'il y a des changements pas encore exportés
function save(changed = true) {
  if (changed) db.changedAt = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { toast("Impossible d'enregistrer sur cet appareil"); }
  updateDot();
}
const needsBackup = () => db.sessions.length > 0 && (!db.backupAt || (db.changedAt && db.changedAt > db.backupAt));
function updateDot() {
  const b = document.getElementById("settings-btn");
  if (!b) return;
  const d = b.querySelector(".dot");
  if (needsBackup() && !d) b.append(h("span", { class: "dot" }));
  if (!needsBackup() && d) d.remove();
}

// Points de restauration gardés sur le téléphone (les 12 derniers)
const BK = "fonte-backups";
function snapshots() { try { return JSON.parse(localStorage.getItem(BK)) || []; } catch { return []; } }
function snapshot(label) {
  const list = snapshots();
  list.unshift({ at: new Date().toISOString(), label, n: db.sessions.length, sessions: clone(db.sessions) });
  try { localStorage.setItem(BK, JSON.stringify(list.slice(0, 12))); } catch {}
}
save(false);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const sorted = () => [...db.sessions].sort((a, b) => b.start.localeCompare(a.start));
const active = () => db.sessions.find(s => !s.done);
const byId = id => db.sessions.find(s => s.id === id);
const types = () => {
  const seen = [];
  [...db.sessions].sort((a, b) => a.start.localeCompare(b.start)).forEach(s => { if (!seen.includes(s.type)) seen.push(s.type); });
  return seen;
};
const lastOfType = t => sorted().find(s => s.type === t && s.done);
const allNames = () => [...new Set(db.sessions.flatMap(s => s.exercises.map(e => e.name)))].sort((a, b) => a.localeCompare(b, "fr"));

// Dernière fois qu'on a fait cet exercice (avant la séance affichée)
function findPrev(name, cur) {
  const k = norm(name);
  for (const s of sorted()) {
    if (s.id === cur.id || (cur.done && s.start >= cur.start)) continue;
    const e = s.exercises.find(x => norm(x.name) === k);
    if (e && e.sets.length) return { s, e };
  }
  return null;
}
function history(name) {
  const k = norm(name);
  return sorted().filter(s => s.done).flatMap(s => s.exercises.filter(e => norm(e.name) === k).map(e => ({ s, e })));
}
const working = e => e.sets.filter(r => !r.wu);
const blankRows = e => e.sets.map(r => ({ kg: r.kg, n: r.n, reps: r.reps, wu: r.wu, mark: null }));

// La séance « logique » = celle qu'on n'a pas faite depuis le plus longtemps
function nextType() {
  const lasts = types().map(t => ({ t, s: lastOfType(t) })).filter(x => x.s);
  if (lasts.length < 2) return null;
  return lasts.sort((a, b) => a.s.start.localeCompare(b.s.start))[0];
}
const daysAgo = d => Math.round((new Date(dateInput(new Date()) + "T12:00:00") - new Date(dateInput(d) + "T12:00:00")) / 864e5);
const agoText = n => n === 0 ? "aujourd'hui" : n === 1 ? "hier" : `il y a ${n} jours`;

// ---------- Navigation ----------
let view = "home";
let detailId = null;
let editing = false;   // séance passée ouverte en mode modification
let editBackup = null; // copie pour « Annuler »
let editChanged = null;
let detailFrom = "history"; // onglet d'où on a ouvert la séance
function openDetail(id) {
  if (view !== "detail") detailFrom = view === "today" ? "history" : view;
  detailId = id; editing = false; editBackup = null;
  show("detail");
  document.getElementById("view-detail").scrollTop = 0;
}
function show(v) {
  if (v !== "detail") { editing = false; editBackup = null; }
  view = v;
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("active", el.id === "view-" + v));
  document.querySelectorAll("nav .tab").forEach(t => t.classList.toggle("on", t.dataset.view === v || (v === "detail" && t.dataset.view === detailFrom)));
  render();
}
document.querySelectorAll("nav .tab").forEach(t => t.onclick = () => {
  if (t.dataset.view === view) document.getElementById("view-" + view).scrollTo({ top: 0, behavior: "smooth" });
  show(t.dataset.view);
});
function render() {
  if (view === "home") renderHome();
  else if (view === "today") renderToday();
  else if (view === "history") renderHistory();
  else if (view === "cal") renderCal();
  else if (view === "detail") renderDetail();
}

// ---------- Horloge ----------
function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = `${now.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" })} · ${fmtTime(now)}`;
  document.querySelectorAll("[data-live]").forEach(el => {
    const s = byId(el.dataset.live);
    if (s) el.textContent = fmtDur(Math.max(0, Math.round((now - new Date(s.start)) / 60000)));
  });
}
setInterval(tick, 15000);

// ---------- Accueil ----------
function recommendations() {
  const out = [];
  const cur = active();
  const nt = nextType();
  const base = cur || (nt && nt.s);
  if (base) {
    for (const e of base.exercises) {
      const prev = history(e.name).find(x => !cur || x.s.id !== cur.id);
      if (!prev) continue;
      const w = working(prev.e), when = fmtShort(new Date(prev.s.start));
      if (!w.length) continue;
      const top = Math.max(...w.map(r => r.kg));
      if (w.every(r => r.mark === "ok")) {
        const step = top >= 20 ? 2.5 : 1;
        out.push({ cls: "up", ic: "trend", title: e.name, text: top ? `Tout validé à ${fmtKg(top)} kg le ${when} : essaie ${fmtKg(Math.round((top + step) * 10) / 10)} kg.` : `Tout validé le ${when} : ajoute des reps ou une série.` });
      } else if (w.some(r => r.mark === "fail")) {
        out.push({ cls: "keep", ic: "alert", title: e.name, text: `Raté le ${when} : garde le même poids, ou descends un peu.` });
      } else if (w.filter(r => r.mark === "near" || r.mark === "half").length >= Math.ceil(w.length / 2)) {
        out.push({ cls: "info", ic: "near", title: e.name, text: `Presque le ${when} : reste à ${fmtKg(top)} kg et vise toutes les reps.` });
      }
      if (prev.e.note) out.push({ cls: "info", ic: "note", title: e.name, text: `Note du ${when} : « ${prev.e.note} »` });
    }
  }
  const last = sorted().find(s => s.done);
  if (last && !cur) {
    const n = daysAgo(new Date(last.start));
    if (n >= 4) out.unshift({ cls: "rest", ic: "moon", title: `${n} jours sans séance`, text: "Reprends en douceur : échauffe-toi bien avant les séries lourdes." });
  }
  if (db.sessions.length && needsBackup()) out.push({ cls: "save", ic: "archive", title: "Sauvegarde conseillée", text: db.backupAt ? "Tu as fait des changements depuis ta dernière sauvegarde." : "Tu n'as encore jamais exporté tes séances.", onclick: backupSheet });
  return out;
}

function renderHome() {
  const box = document.getElementById("view-home");
  box.innerHTML = "";
  const now = new Date();
  box.append(h("div", { class: "today" }, h("span", { class: "muted" }, "Aujourd'hui"), h("b", {}, fmtDay(now))));

  // Carte principale : séance en cours ou séance au programme
  const cur = active(), nt = nextType();
  if (cur) {
    box.append(h("div", { class: "hero" }, h("span", { class: "k" }, "En cours"), h("b", {}, cur.type),
      h("p", {}, `Commencée à ${fmtTime(new Date(cur.start))} · ${cur.exercises.length} exercices`),
      h("button", { class: "btn primary block", onclick: () => show("today") }, icon("dumbbell"), "Reprendre la séance")));
  } else if (nt) {
    box.append(h("div", { class: "hero" }, h("span", { class: "k" }, "Au programme"), h("b", {}, nt.t),
      h("p", {}, `Dernière fois ${agoText(daysAgo(new Date(nt.s.start)))} (${fmtShort(new Date(nt.s.start))}) · ${nt.s.exercises.length} exercices`),
      h("div", { style: "display:flex;gap:8px" },
        h("button", { class: "btn primary", style: "flex:1", onclick: () => startSession(nt.t, nt.s) }, "Commencer"),
        h("button", { class: "btn", onclick: () => show("today") }, "Autre séance"))));
  } else {
    box.append(h("div", { class: "hero" }, h("span", { class: "k" }, "Bienvenue"), h("b", {}, "Première séance"),
      h("p", {}, "Choisis ou crée ta séance, les exercices seront repris la fois suivante."),
      h("button", { class: "btn primary block", onclick: () => show("today") }, "Choisir une séance")));
  }

  const done = sorted().filter(s => s.done);
  const last = done[0];
  if (last) {
    box.append(h("h2", {}, `Dernière séance · ${agoText(daysAgo(new Date(last.start)))}`));
    box.append(histCard(last));
  }

  // Semaine en cours (lundi → dimanche)
  const monday = new Date(now); monday.setHours(12, 0, 0, 0); monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; });
  const doneDays = new Set(db.sessions.map(s => s.start.slice(0, 10)));
  const nWeek = days.filter(d => doneDays.has(dateInput(d))).length;
  box.append(h("h2", {}, `Cette semaine · ${nWeek} séance${nWeek > 1 ? "s" : ""}`));
  box.append(h("div", { class: "week" }, ...days.map(d => h("span", {},
    d.toLocaleDateString("fr-FR", { weekday: "narrow" }).toUpperCase(),
    h("i", { class: (doneDays.has(dateInput(d)) ? "on" : "") + (sameDay(d, now) ? " today" : "") }, doneDays.has(dateInput(d)) ? icon("ok") : String(d.getDate()))))));

  const month = dateInput(now).slice(0, 7);
  const inMonth = done.filter(s => s.start.startsWith(month));
  const okSets = inMonth.reduce((a, s) => a + s.exercises.reduce((b, e) => b + working(e).filter(r => r.mark === "ok").reduce((c, r) => c + r.n, 0), 0), 0);
  box.append(h("div", { class: "metrics", style: "margin-top:8px" },
    h("div", { class: "metric" }, h("small", {}, "Séances"), h("b", {}, done.length)),
    h("div", { class: "metric" }, h("small", {}, "Ce mois-ci"), h("b", {}, inMonth.length)),
    h("div", { class: "metric" }, h("small", {}, "Séries réussies"), h("b", {}, okSets))));

  const recs = recommendations();
  if (recs.length) {
    box.append(h("h2", {}, cur ? "Conseils pour cette séance" : nt ? `Conseils pour ${nt.t}` : "Conseils"));
    box.append(h("div", { class: "recs" }, ...recs.slice(0, 7).map(r => h(r.onclick ? "button" : "div", { class: "rec", onclick: r.onclick },
      h("span", { class: "ico " + r.cls }, icon(r.ic)),
      h("span", { class: "tx" }, h("b", {}, r.title), h("small", {}, r.text)),
      r.onclick ? icon("chev") : null))));
  }
}

function renderToday() {
  const box = document.getElementById("view-today");
  const s = active();
  if (s) { renderSession(s, box); return; }
  box.innerHTML = "";
  box.append(h("div", { class: "today" }, h("span", { class: "muted" }, "Nouvelle séance"), h("b", {}, "Quelle séance ?")));
  box.append(h("div", { style: "height:12px" }));

  const lasts = types().map(t => ({ t, s: lastOfType(t) }));
  const next = nextType();
  const list = h("div", { class: "types" });
  lasts.forEach(({ t, s: last }) => {
    const isNext = next && next.t === t;
    list.append(h("button", { class: "type" + (isNext ? " next" : ""), onclick: () => startSession(t, last) },
      h("span", { class: "tx" },
        isNext ? h("span", { class: "badge" }, "Au programme") : null,
        h("b", {}, t),
        h("small", {}, last ? `Dernière : ${fmtShort(new Date(last.start))} · ${last.exercises.length} exercices` : "Jamais faite")),
      icon("chev")));
  });
  list.append(h("button", { class: "type free", onclick: freeSession },
    h("span", { class: "tx" }, h("b", {}, lasts.length ? "Autre séance" : "Nouvelle séance"), h("small", {}, lasts.length ? "Partir de zéro ou créer un nouveau type" : "Donne-lui un nom (ex. Pecs triceps), puis ajoute tes exercices")), icon("plus")));
  box.append(list);
}

function startSession(type, from) {
  if (active()) { toast("Une séance est déjà en cours"); return; }
  const now = new Date();
  const s = { id: uid(), type, start: localIso(now), hasTime: true, end: null, done: false,
    exercises: from ? from.exercises.map(e => ({ id: uid(), name: e.name, reps: e.reps, set: e.set || "", note: "", sets: blankRows(e) })) : [] };
  db.sessions.push(s); save();
  show("today");
  document.getElementById("view-today").scrollTop = 0;
}

function freeSession() {
  const inp = h("input", { placeholder: "Ex. Épaules, Full body…", autocapitalize: "sentences" });
  const close = sheet("Nouvelle séance", h("div", {},
    h("div", { class: "field" }, h("label", {}, "Nom de la séance"), inp),
    h("p", { class: "muted", style: "font-size:13px;margin:0" }, "Elle démarre vide : ajoute tes exercices au fur et à mesure.")), [
    h("button", { class: "btn ghost", onclick: () => close() }, "Annuler"),
    h("button", { class: "btn primary", onclick: () => {
      const t = inp.value.trim();
      if (!t) { inp.focus(); return; }
      close(); startSession(t, lastOfType(t) || null);
    } }, "Commencer")
  ]);
  setTimeout(() => inp.focus(), 250);
}

// ---------- Séance (en cours ou passée) ----------
function renderSession(s, box, fromHistory) {
  const y = box.scrollTop;
  box.innerHTML = "";
  // Séance passée ouverte en modification : barre « Annuler / OK »
  if (fromHistory) box.append(h("div", { class: "editbar" }, h("span", {}, icon("pencil"), "Modification"),
    h("button", { class: "cancel", onclick: cancelEdit }, "Annuler"),
    h("button", { class: "okb", onclick: confirmEdit }, "OK")));

  const start = new Date(s.start);

// ---------- Roulettes (poids, séries, reps) ----------
const IH = 44;
function wheel(values, value, fmt, cls, label) {
  const sc = h("div", { class: "wsc" }, h("div", { class: "wsp" }));
  const items = values.map((v, i) => {
    const it = h("div", { class: "wi", onclick: () => sc.scrollTo({ top: i * IH, behavior: "smooth" }) }, fmt(v));
    sc.append(it); return it;
  });
  sc.append(h("div", { class: "wsp" }));
  const col = h("div", { class: "wcol " + cls }, sc, h("label", {}, label || " "));
  let idx = Math.max(0, values.indexOf(value));
  const at = () => Math.min(values.length - 1, Math.max(0, Math.round(sc.scrollTop / IH)));
  const paint = () => { items[idx].classList.remove("on"); idx = at(); items[idx].classList.add("on"); };
  sc.addEventListener("scroll", paint, { passive: true });
  col.init = () => { sc.scrollTop = idx * IH; items.forEach(x => x.classList.remove("on")); items[idx].classList.add("on"); };
  col.get = () => values[at()];
  col.set = v => { const i = values.indexOf(v); if (i >= 0) sc.scrollTo({ top: i * IH, behavior: "smooth" }); };
  return col;
}
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

function wheelSheet(s, e, r, isNew) {
  let wu = !!r.wu;
  const ki = Math.floor(r.kg + 1e-9), kd = Math.round((r.kg - ki) * 10);
  const wKg = wheel(range(0, 300), ki, v => v, "kg", "Kilos");
  const wDec = wheel(range(0, 9), kd, v => "," + v, "dec", "");
  const wN = wheel(range(1, 10), r.n, v => v, "n", "Séries");
  const wR = wheel(range(1, 30), r.reps || e.reps, v => v, "reps", "Reps");
  const bump = d => {
    const cur = wKg.get() + wDec.get() / 10;
    const v = Math.max(0, Math.round((cur + d) * 10) / 10);
    wKg.set(Math.floor(v + 1e-9)); wDec.set(Math.round((v - Math.floor(v + 1e-9)) * 10));
  };
  const sw = h("button", { class: "switch" + (wu ? " on" : ""), "aria-label": "Échauffement", onclick: () => { wu = !wu; sw.classList.toggle("on", wu); } });
  const body = h("div", {},
    h("div", { class: "wheels" }, wKg, wDec, h("span", { class: "wsep" }, "×"), wN, wR),
    h("div", { class: "quick" }, ...[-5, -2.5, -1, 1, 2.5, 5].map(d => h("button", { onclick: () => bump(d) }, (d > 0 ? "+" : "−") + fmtKg(Math.abs(d))))),
    h("div", { class: "toggle" }, h("span", {}, "Échauffement"), sw),
    h("p", { class: "muted", style: "font-size:12.5px;margin:2px 2px 0" }, "0 kg = poids du corps."));
  const actions = [];
  if (!isNew) actions.push(h("button", { class: "btn danger", onclick: () => { e.sets.splice(e.sets.indexOf(r), 1); save(); close(); render(); } }, icon("trash"), "Retirer"));
  actions.push(h("button", { class: "btn primary", onclick: () => {
    r.kg = Math.round((wKg.get() + wDec.get() / 10) * 10) / 10;
    r.n = wN.get();
    const reps = wR.get();
    r.reps = reps === e.reps ? null : reps;
    r.wu = wu;
    if (isNew) {
      if (wu) { const k = e.sets.findIndex(x => !x.wu); e.sets.splice(k < 0 ? e.sets.length : k, 0, r); }
      else e.sets.push(r);
    }
    save(); close(); render();
  } }, isNew ? "Ajouter" : "Valider"));
  const close = sheet(h("span", {}, isNew ? (wu ? "Nouvel échauffement" : "Nouvelle série") : "Modifier", h("small", {}, `${e.name} · ${e.reps} reps visés`)), body, actions);
  [wKg, wDec, wN, wR].forEach(w => w.init());
}

function exSheet(s, e) {

  everywhere.onclick = () => everywhere.classList.toggle("on");

    h("div", { class: "field" }, h("label", {}, "Réglage machine (gardé d'une séance à l'autre)"), set),
    h("div", { class: "field" }, h("label", {}, "Note du jour"), note));

  if (!isNew) {
    const i = s.exercises.indexOf(e);
    const move = d => { const j = i + d; if (j < 0 || j >= s.exercises.length) return; s.exercises.splice(i, 1); s.exercises.splice(j, 0, e); save(); close(); render(); };

      h("button", { class: "btn danger", onclick: () => { s.exercises.splice(i, 1); save(); close(); render(); } }, icon("trash"), "Retirer")));
    const hist = history(e.name).filter(x => x.s.id !== s.id).slice(0, 8);

      ...hist.map(({ s: hs, e: he }) => h("div", { class: "it" }, h("span", {}, fmtShort(new Date(hs.start))),
        h("span", {}, ...working(he).map(r => h("span", { class: "pchip" }, `${fmtKg(r.kg)}×${r.n}`,
          r.mark ? h("span", { class: "c-" + r.mark, html: ic(r.mark), style: "display:contents" }) : null)))))));
  }

  const close = sheet(isNew ? "Ajouter un exercice" : "Modifier l'exercice", body, [
    h("button", { class: "btn ghost", onclick: () => close() }, "Annuler"),
    h("button", { class: "btn primary", onclick: () => {
      const n = name.value.trim();
      if (!n) { name.focus(); return; }
      if (isNew) {
        const last = history(n)[0];
        s.exercises.push({ id: uid(), name: n, reps, set: set.value.trim(), note: note.value.trim(), sets: last ? blankRows(last.e) : [] });
      } else {
        if (everywhere.classList.contains("on") && n !== oldName)
          db.sessions.forEach(x => x.exercises.forEach(y => { if (norm(y.name) === norm(oldName)) y.name = n; }));
        Object.assign(e, { name: n, reps, set: set.value.trim(), note: note.value.trim() });
      }
      save(); close(); render();
    } }, isNew ? "Ajouter" : "Valider")
  ]);

}

function finish(s) {
  const pend = s.exercises.reduce((a, e) => a + e.sets.filter(r => !r.mark).length, 0);
  const done = keep => {
    if (!keep) s.exercises.forEach(e => { e.sets = e.sets.filter(r => r.mark); });
    s.exercises = s.exercises.filter(e => e.sets.length || e.note);
    s.end = localIso(new Date()); s.done = true;
    save(); snapshot(`Fin de séance : ${s.type} du ${fmtShort(new Date(s.start))}`);

    h("button", { class: "btn", onclick: () => { close(); done(true); } }, "Garder"),

}

// ---------- Calendrier ----------
const TYPE_COLORS = ["#b8a4ff", "#9be7c4", "#ffc3a8", "#a7d3ff", "#ffe29a", "#ffadb0", "#d9c9ff", "#c4f0e0"];
const typeColor = t => TYPE_COLORS[Math.max(0, types().indexOf(t)) % TYPE_COLORS.length];
let calY = new Date().getFullYear(), calM = new Date().getMonth();
function moveMonth(d) {
  calM += d;
  if (calM < 0) { calM = 11; calY--; } else if (calM > 11) { calM = 0; calY++; }
  renderCal();
}
function renderCal() {
  const box = document.getElementById("view-cal");
  box.innerHTML = "";
  const now = new Date();
  const first = new Date(calY, calM, 1, 12);
  const prefix = `${calY}-${pad(calM + 1)}`;
  const inMonth = db.sessions.filter(s => s.start.startsWith(prefix)).sort((a, b) => a.start.localeCompare(b.start));
  const byDay = {};
  db.sessions.forEach(s => (byDay[s.start.slice(0, 10)] ||= []).push(s));
  const nDays = new Set(inMonth.map(s => s.start.slice(0, 10))).size;

  box.append(h("div", { class: "cal-head" },
    h("button", { class: "icon-btn", "aria-label": "Mois précédent", onclick: () => moveMonth(-1) }, icon("back")),
    h("h2", {}, cap(first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })),
      h("small", {}, nDays ? `${nDays} jour${nDays > 1 ? "s" : ""} de salle` : "Aucune séance")),
    h("button", { class: "icon-btn", "aria-label": "Mois suivant", onclick: () => moveMonth(1) }, icon("chev"))));
  if (calY !== now.getFullYear() || calM !== now.getMonth())
    box.append(h("button", { class: "today-btn", onclick: () => { calY = now.getFullYear(); calM = now.getMonth(); renderCal(); } }, "Revenir à aujourd'hui"));

  // Grille du lundi au dimanche, avec les jours des mois voisins en grisé
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const weeks = Math.ceil((((first.getDay() + 6) % 7) + new Date(calY, calM + 1, 0).getDate()) / 7);
  const grid = h("div", { class: "cal-grid" });
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = dateInput(d), list = byDay[key] || [];
    const cls = ["cd", d.getMonth() !== calM ? "out" : "", sameDay(d, now) ? "today" : "", list.length ? "gym" : ""].join(" ");
    const bg = list.length ? `background:${typeColor(list[0].type)}` : "";
    grid.append(h("button", { class: cls, "aria-label": list.length ? `${d.getDate()} : ${list.map(s => s.type).join(", ")}` : String(d.getDate()),
      onclick: list.length ? () => dayOpen(list) : null },
      h("span", { style: bg }, String(d.getDate()), list.length > 1 ? h("i", {}, list.length) : null)));
  }
  const cal = h("div", { class: "cal" },
    h("div", { class: "cal-dow" }, ...["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map(x => h("span", {}, x))), grid);
  // Glisser à gauche / à droite pour changer de mois
  let x0 = null;
  cal.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  cal.addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) moveMonth(dx < 0 ? 1 : -1); });
  box.append(cal);

  const counts = {};
  inMonth.forEach(s => counts[s.type] = (counts[s.type] || 0) + 1);
  if (inMonth.length) {
    box.append(h("div", { class: "cal-legend" }, ...Object.entries(counts).map(([t, n]) =>
      h("span", {}, h("b", { style: `background:${typeColor(t)}` }), `${t} · ${n}`))));
    box.append(h("h2", {}, `Séances de ${first.toLocaleDateString("fr-FR", { month: "long" })}`));
    [...inMonth].reverse().forEach(s => box.append(histCard(s)));
  }
}
function dayOpen(list) {
  if (list.length === 1) { const s = list[0]; return s.done ? openDetail(s.id) : show("today"); }
  const close = sheet(fmtDay(new Date(list[0].start)), h("div", {}, ...list.map(s => {
    const c = histCard(s); c.addEventListener("click", () => close(), true); return c;
  })));
}

function renderDetail() {
  const s = byId(detailId);
  if (!s) return show("history");
  const box = document.getElementById("view-detail");
  if (editing) renderSession(s, box, true); else renderReadOnly(s, box);
}

// ---------- Feuilles du bas ----------
function sheet(title, body, actions) {
  const bd = h("div", { class: "backdrop" });
  const sh = h("div", { class: "sheet" }, h("div", { class: "grab" }), title ? h("h3", {}, title) : null, body,
    actions && actions.length ? h("div", { class: "sheet-actions" }, ...actions) : null);
  bd.append(sh);
  bd.addEventListener("click", ev => { if (ev.target === bd) close(); });
  document.body.append(bd);
  requestAnimationFrame(() => bd.classList.add("on"));
  function close() { bd.classList.remove("on"); setTimeout(() => bd.remove(), 220); }
  return close;
}
function confirmSheet(title, text, label, fn, primary) {
  const close = sheet(title, h("p", { class: "muted", style: "margin:0" }, text), [
    h("button", { class: "btn ghost", onclick: () => close() }, "Annuler"),
    h("button", { class: "btn " + (primary ? "primary" : "danger"), style: primary ? "" : "border:1px solid var(--fail)", onclick: () => { close(); fn(); } }, label)
  ]);
}

// ---------- Sauvegardes : exporter, importer, points de restauration ----------
const fmtStamp = iso => { const d = new Date(iso); return `${d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} à ${fmtTime(d)}`; };

async function exportData() {
  const name = `fonte-${dateInput(new Date())}.json`;
  const blob = new Blob([JSON.stringify({ app: "fonte", v: 1, exportedAt: new Date().toISOString(), sessions: db.sessions }, null, 1)], { type: "application/json" });
  const f = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: name }); markExported(); return; }
    catch (err) { if (err.name === "AbortError") return; }
  }
  const a = h("a", { href: URL.createObjectURL(blob), download: name }); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  markExported();
}
function markExported() { db.backupAt = new Date().toISOString(); save(false); toast("Sauvegarde exportée"); render(); }

// Import tolérant : on complète ce qui manque plutôt que de refuser le fichier
function cleanSession(x) {
  if (!x || typeof x.start !== "string" || !Array.isArray(x.exercises)) return null;
  return { id: x.id || uid(), type: x.type || "Séance", start: x.start, hasTime: x.hasTime !== false, end: x.end || null, done: x.done !== false,
    exercises: x.exercises.filter(e => e && e.name).map(e => ({ id: e.id || uid(), name: String(e.name), reps: +e.reps || 10, set: e.set || "", note: e.note || "",
      sets: (Array.isArray(e.sets) ? e.sets : []).map(r => ({ kg: +r.kg || 0, n: +r.n || 1, reps: r.reps ? +r.reps : null, wu: !!r.wu, mark: MARKS[r.mark] ? r.mark : null })) })) };
}
function importFile(f) {
  f.text().then(txt => {
    let d;
    try { d = JSON.parse(txt); } catch { return toast("Ce fichier n'est pas une sauvegarde Fonte"); }
    if (!d || !["fonte", "seance"].includes(d.app) || !Array.isArray(d.sessions)) return toast("Ce fichier n'est pas une sauvegarde Fonte");
    const list = d.sessions.map(cleanSession).filter(Boolean);
    if (!list.length) return toast("Aucune séance dans ce fichier");
    const ids = new Set(db.sessions.map(x => x.id));
    const missing = list.filter(x => !ids.has(x.id));
    const dates = list.map(x => x.start).sort();
    const close = sheet("Importer cette sauvegarde ?", h("div", {},
      h("p", { class: "muted", style: "margin:0 0 6px" }, `${list.length} séance${list.length > 1 ? "s" : ""}, du ${fmtShort(new Date(dates[0]))} au ${fmtShort(new Date(dates[dates.length - 1]))}${d.exportedAt ? ` (exportée le ${fmtStamp(d.exportedAt)})` : ""}.`),
      h("p", { class: "muted", style: "margin:0;font-size:13px" }, "Un point de restauration est créé avant, tu peux revenir en arrière.")), [
      h("button", { class: "btn", onclick: () => {
        close(); snapshot("Avant import (ajout)");
        db.sessions.push(...missing); save(); render();
        toast(missing.length ? `${missing.length} séance${missing.length > 1 ? "s" : ""} ajoutée${missing.length > 1 ? "s" : ""}` : "Rien de nouveau à ajouter");
      } }, `Ajouter les manquantes (${missing.length})`),
      h("button", { class: "btn primary", onclick: () => {
        close(); snapshot("Avant import (remplacement)");
        db.sessions = list; save(); show("home"); toast("Sauvegarde restaurée");
      } }, "Tout remplacer")
    ]);
  });
}

function backupSheet() {
  const file = h("input", { type: "file", accept: "application/json,.json", hidden: true });
  file.onchange = () => { const f = file.files[0]; if (f) { close(); importFile(f); } };
  const need = needsBackup();
  const state = h("div", { class: "bk-state" },
    h("span", { class: "ico " + (need ? "keep" : "up"), style: "width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none" }, icon(need ? "alert" : "ok")),
    h("span", {}, need ? h("b", {}, "Changements pas encore sauvegardés") : h("b", {}, "Tout est sauvegardé"),
      h("small", { class: "muted", style: "display:block" }, db.backupAt ? `Dernier export : ${fmtStamp(db.backupAt)}` : "Aucun export pour l'instant")));
  const list = h("div", { class: "bk-list" });
  const fill = () => {
    list.innerHTML = "";
    const snaps = snapshots();
    if (!snaps.length) list.append(h("p", { class: "muted", style: "font-size:13px;margin:4px 2px" }, "Aucun point pour l'instant."));
    snaps.forEach(sn => list.append(h("div", { class: "it" },
      h("div", {}, sn.label, h("small", {}, `${fmtStamp(sn.at)} · ${sn.n} séances`)),
      h("button", { onclick: () => { close(); confirmSheet("Revenir à ce point ?", `Tes séances redeviennent celles du ${fmtStamp(sn.at)}. L'état actuel est gardé en point de restauration.`, "Restaurer", () => {
        snapshot("Avant restauration");
        db.sessions = clone(sn.sessions); save(); show("home"); toast("Point de restauration appliqué");
      }, true); } }, "Restaurer"))));
  };
  fill();
  const close = sheet(h("span", {}, "Sauvegardes", h("small", {}, `${db.sessions.length} séances sur ce téléphone`)), h("div", {},
    state,
    h("div", { style: "display:grid;gap:8px" },
      h("button", { class: "btn primary block", onclick: exportData }, icon("download"), "Exporter une sauvegarde"),
      h("button", { class: "btn block", onclick: () => file.click() }, icon("upload"), "Importer une sauvegarde")),
    file,
    h("p", { class: "muted", style: "font-size:12.5px;margin:8px 2px 0" }, "Range le fichier dans Fichiers → iCloud Drive pour le retrouver même si tu changes de téléphone."),
    h("h2", {}, "Points de restauration"),
    h("p", { class: "muted", style: "font-size:12.5px;margin:-4px 2px 8px" }, "Créés tout seuls à la fin de chaque séance et après chaque modification. Gardés sur ce téléphone (les 12 derniers)."),
    h("button", { class: "btn block", style: "margin-bottom:6px", onclick: () => { snapshot("Point manuel"); fill(); toast("Point de restauration créé"); } }, icon("restore"), "Créer un point maintenant"),
    list));
}
document.getElementById("settings-btn").onclick = backupSheet;

updateDot();
render();
tick();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
